<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#0b3d91"><title>Control Financiero</title><script>try{var t=localStorage.getItem('theme_mode_v1');document.documentElement.classList.add(t==='dark'?'theme-dark':'theme-light')}catch(e){document.documentElement.classList.add('theme-light')}</script><link rel="stylesheet" href="style.css?v=20"><link rel="stylesheet" href="tabs.css?v=1"><script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body><main class="app">
<header class="hero" id="appHeader"><div class="hero-top"><p class="eyebrow">CONTROL FINANCIERO</p><button id="themeToggle" class="theme-toggle" type="button" aria-label="Cambiar a modo noche" title="Modo noche"><span id="themeIcon" aria-hidden="true">☾</span></button></div><h1>Mis finanzas</h1><p class="subtitle">Gestiona tus ingresos y gastos.</p></header>
<section id="home" class="screen"><button class="main-card" id="registerButton" type="button"><span class="card-icon">↕</span><span><strong>Registro</strong><small>Registra tus ingresos y gastos</small></span><span class="arrow">›</span></button><button class="main-card" id="reportsButton" type="button"><span class="card-icon">▥</span><span><strong>Informes</strong><small>Consulta el resumen de tus finanzas</small></span><span class="arrow">›</span></button></section>
<section id="register" class="screen hidden"><div class="register-top"><button class="back" id="backButton" type="button">‹ Volver</button><button id="registerThemeToggle" class="theme-toggle" type="button" aria-label="Cambiar a modo noche" title="Modo noche"><span id="registerThemeIcon" aria-hidden="true">☾</span></button></div><div class="register-tabs" role="tablist" aria-label="Registro y movimientos"><button id="registerTabRegister" data-tab="register" class="register-tab active" type="button" role="tab" aria-selected="true">Registro</button><button id="movementsTabRegister" data-tab="movements" class="register-tab" type="button" role="tab" aria-selected="false">Movimientos</button></div>
<div class="register-panel">
  <div class="type-switch" role="tablist" aria-label="Tipo de movimiento">
    <button id="incomeTab" class="type-tab income active" type="button" role="tab" aria-selected="true"><span>＋</span><strong>Ingresos</strong></button>
    <button id="expenseTab" class="type-tab expense" type="button" role="tab" aria-selected="false"><span>−</span><strong>Gastos</strong></button>
  </div>
  <div class="inline-form">
    <div class="amount-box"><span class="currency">€</span><input id="activeAmount" type="text" inputmode="decimal" placeholder="0,00" aria-label="Importe"></div>
    <div class="keypad" id="sharedKeypad" aria-label="Teclado numérico"><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key="clear">C</button><button data-key="0">0</button><button data-key="backspace">⌫</button></div>
    <div class="secondary-fields"><label class="field">Fecha<input id="activeDate" type="date"></label><label class="field">Categoría<select id="activeCategory"><option value="">Selecciona una categoría</option></select></label><label class="field description-field hidden" id="personField">Persona<input id="activePerson" type="text" maxlength="80" placeholder="¿Quién realizó este movimiento?"></label><label class="field description-field hidden" id="descriptionField">Descripción<textarea id="activeDescription" rows="2" maxlength="160" placeholder="Describe el movimiento"></textarea></label><label class="field hidden" id="payMonthField">Mes que corresponde<select id="activePayMonth"><option value="">Selecciona un mes</option><option>Enero</option><option>Febrero</option><option>Marzo</option><option>Abril</option><option>Mayo</option><option>Junio</option><option>Julio</option><option>Agosto</option><option>Septiembre</option><option>Octubre</option><option>Noviembre</option><option>Diciembre</option></select></label></div>
    <button class="save active-save" id="saveActive" type="button">Guardar ingreso</button>
  </div>
</div>
</section>
<section id="movementForm" class="screen hidden"></section>
<section id="movements" class="screen hidden"><div class="register-top"><button class="back" id="movementsBack" type="button">‹ Volver</button><button id="movementsThemeToggle" class="theme-toggle" type="button" aria-label="Cambiar a modo noche" title="Modo noche"><span id="movementsThemeIcon" aria-hidden="true">☾</span></button></div><div class="register-tabs" role="tablist" aria-label="Registro y movimientos"><button id="registerTabMovements" data-tab="register" class="register-tab" type="button" role="tab" aria-selected="false">Registro</button><button id="movementsTabMovements" data-tab="movements" class="register-tab active" type="button" role="tab" aria-selected="true">Movimientos</button></div><h2>Movimientos</h2><p class="section-note">Últimos movimientos registrados</p><div id="movementList" class="movement-list"></div></section>
<section id="reports" class="screen hidden"><button class="back" id="reportsBack" type="button">‹ Volver</button><h2>Informes</h2><div class="report-card"><span>Total ingresos</span><strong id="incomeTotal">€0,00</strong></div><div class="report-card"><span>Total gastos</span><strong id="expenseTotal">€0,00</strong></div><div class="report-card balance"><span>Saldo</span><strong id="balanceTotal">€0,00</strong></div><div class="recent-section reports-records"><div class="recent-heading"><strong>Todos los registros</strong><span id="reportCount">0</span></div><div id="reportMovements" class="recent-movements"><p class="empty-list">Todavía no hay movimientos registrados.</p></div></div></section>
</main><div id="toast" class="toast"></div><script src="app.js?v=21"></script></body></html>
