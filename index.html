<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>Asistente IA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:light dark;--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--border:#e5e7eb;--user:#2563eb;--accent:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--tg-theme-bg-color,var(--bg));color:var(--tg-theme-text-color,var(--text));font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;height:100vh;height:100dvh;display:flex;flex-direction:column}header{padding:14px 16px;border-bottom:1px solid var(--tg-theme-section-bg-color,var(--border));display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:20px}.title{font-weight:750}.sub{font-size:12px;color:var(--tg-theme-hint-color,var(--muted))}.status{margin-left:auto;font-size:11px;color:#16a34a}.status.off{color:#dc2626}#messages{flex:1;overflow:auto;padding:18px 14px 12px;display:flex;flex-direction:column;gap:12px}.row{display:flex}.row.user{justify-content:flex-end}.bubble{max-width:88%;padding:11px 13px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 2px #0000000d}.user .bubble{background:var(--user);color:#fff;border-bottom-right-radius:5px}.assistant .bubble{background:var(--tg-theme-secondary-bg-color,var(--card));border:1px solid var(--tg-theme-section-bg-color,var(--border));border-bottom-left-radius:5px}.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}footer{padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--tg-theme-section-bg-color,var(--border))}.composer{display:flex;gap:8px;align-items:flex-end}.input{flex:1;resize:none;min-height:44px;max-height:140px;padding:12px;border:1px solid #cbd5e1;border-radius:15px;background:var(--tg-theme-secondary-bg-color,var(--card));color:inherit;outline:none}.input:focus{border-color:var(--accent)}button{border:0;border-radius:14px;min-width:46px;height:46px;background:var(--accent);color:#fff;font-size:18px}button:disabled{opacity:.45}.hint{text-align:center;font-size:11px;color:var(--tg-theme-hint-color,var(--muted));margin-top:6px}
</style></head><body><div class="app"><header><div class="logo">🤖</div><div><div class="title">Asistente IA</div><div class="sub">NVIDIA Nemotron · Streaming</div></div><div id="status" class="status">● CONECTANDO</div></header><main id="messages"></main><footer><div class="composer"><textarea id="input" class="input" rows="1" placeholder="Escribe tu pregunta…"></textarea><button id="send" aria-label="Enviar">➤</button></div><div class="hint">Enter para enviar · Shift+Enter para nueva línea</div></footer></div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}
// URL HTTPS temporal del Cloudflare Quick Tunnel para esta prueba local.
const API_URL=window.API_URL||"https://elected-jar-late-overcome.trycloudflare.com";const messagesEl=document.getElementById('messages'),input=document.getElementById('input'),send=document.getElementById('send'),status=document.getElementById('status');let history=[],busy=false;
function add(role,text='',typing=false){const row=document.createElement('div');row.className='row '+role;const b=document.createElement('div');b.className='bubble';if(typing)b.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';else b.textContent=text;row.appendChild(b);messagesEl.appendChild(row);messagesEl.scrollTop=messagesEl.scrollHeight;return b}
function welcome(){add('assistant','¡Hola! 👋 Soy tu asistente de IA.\n\nEscribe una pregunta y verás cómo Nemotron genera la respuesta en tiempo real.')}
function setStatus(text,on=true){status.textContent='● '+text;status.className='status'+(on?'':' off')}
async function ask(){const text=input.value.trim();if(!text||busy)return;if(!tg?.initData){add('assistant','⚠️ Abre esta Mini App desde Telegram para poder autenticar la conexión.');return}busy=true;send.disabled=true;input.value='';input.style.height='44px';add('user',text);history.push({role:'user',content:text});const bubble=add('assistant','',true);let answer='';try{const res=await fetch(API_URL.replace(/\/$/,'')+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData,messages:history})});if(!res.ok)throw new Error((await res.text()).slice(0,500)||('HTTP '+res.status));if(!res.body)throw new Error('El servidor no permite streaming');setStatus('CONECTADO');const reader=res.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const events=buffer.split('\n\n');buffer=events.pop()||'';for(const event of events){const line=event.split('\n').find(x=>x.startsWith('data: '));if(!line)continue;const data=JSON.parse(line.slice(6));if(data.type==='delta'){answer+=data.content;bubble.textContent=answer;messagesEl.scrollTop=messagesEl.scrollHeight}else if(data.type==='error')throw new Error(data.message||'Error del servidor')}}if(!answer)throw new Error('La IA devolvió una respuesta vacía');history.push({role:'assistant',content:answer})}catch(err){setStatus('SIN CONEXIÓN',false);bubble.textContent='⚠️ No se pudo completar la consulta. '+(err.message||'Error de conexión.');history.pop()}finally{busy=false;send.disabled=false;input.focus()}}
send.addEventListener('click',ask);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});input.addEventListener('input',()=>{input.style.height='44px';input.style.height=Math.min(input.scrollHeight,140)+'px'});welcome();
</script></body></html>
