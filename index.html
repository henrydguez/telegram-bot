<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b3d91"><title>Control Financiero</title><link rel="stylesheet" href="style.css?v=3"><script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body><main class="app">
<header class="hero"><p class="eyebrow">CONTROL FINANCIERO</p><h1>Mis finanzas</h1><p class="subtitle">Gestiona tus ingresos y gastos.</p></header>
<section id="home" class="screen"><button class="main-card" id="registerButton" type="button"><span class="card-icon">↕</span><span><strong>Registro</strong><small>Registra tus ingresos y gastos</small></span><span class="arrow">›</span></button><button class="main-card" id="reportsButton" type="button"><span class="card-icon">▥</span><span><strong>Informes</strong><small>Consulta el resumen de tus finanzas</small></span><span class="arrow">›</span></button></section>
<section id="register" class="screen hidden"><button class="back" id="backButton" type="button">‹ Volver</button><h2>Registro</h2><p class="section-note">Selecciona el tipo de movimiento</p><div class="choice-grid"><button class="choice income" id="incomeButton" type="button"><span>＋</span><strong>Ingreso</strong><small>Dinero recibido</small></button><button class="choice expense" id="expenseButton" type="button"><span>−</span><strong>Gastos</strong><small>Dinero gastado</small></button></div></section>
<section id="movementForm" class="screen hidden"><button class="back" id="formBack" type="button">‹ Volver</button><div class="amount-heading"><span id="formTitle">Ingreso</span><small>Completa los datos del movimiento</small></div><label class="field">Importe<input id="amountInput" type="text" inputmode="decimal" placeholder="0,00"></label><label class="field">Fecha<input id="dateInput" type="date"></label><label class="field">Categoría<select id="categoryInput"><option value="">Selecciona una categoría</option><option>Salario</option><option>Trabajo</option><option>Ventas</option><option>Inversiones</option><option>Alimentación</option><option>Transporte</option><option>Vivienda</option><option>Ocio</option><option>Compras</option><option>Salud</option><option>Otros</option></select></label><label class="field">Descripción<textarea id="descriptionInput" rows="3" maxlength="160" placeholder="Añade una descripción (opcional)"></textarea></label><div class="keypad"><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key="clear">C</button><button data-key="0">0</button><button data-key="backspace">⌫</button></div><button class="save" id="saveButton" type="button">Guardar movimiento</button></section>
<section id="movements" class="screen hidden"><button class="back" id="movementsBack" type="button">‹ Volver</button><h2>Registro de movimientos</h2><p class="section-note">Todos tus ingresos y gastos</p><div id="movementList" class="movement-list"></div></section>
<section id="reports" class="screen hidden"><button class="back" id="reportsBack" type="button">‹ Volver</button><h2>Totales</h2><div class="report-card"><span>Total ingresos</span><strong id="incomeTotal">€0,00</strong></div><div class="report-card"><span>Total gastos</span><strong id="expenseTotal">€0,00</strong></div><div class="report-card balance"><span>Saldo</span><strong id="balanceTotal">€0,00</strong></div><button class="main-card" id="movementsButton" type="button"><span class="card-icon">☷</span><span><strong>Registro de movimientos</strong><small>Ver todos los movimientos</small></span><span class="arrow">›</span></button></section>
</main><div id="toast" class="toast"></div><script src="app.js?v=3"></script></body></html>
