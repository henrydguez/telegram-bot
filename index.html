<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d91">
  <title>Control Financiero</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">CONTROL FINANCIERO</p>
        <h1>Mis finanzas</h1>
        <p class="subtitle">Gestiona tus ingresos y gastos.</p>
      </div>
    </header>

    <section id="home" class="screen" aria-label="Inicio">
      <button class="main-card" id="registerButton" type="button">
        <span class="card-icon">↕</span>
        <span><strong>Registro</strong><small>Registra tus ingresos y gastos</small></span>
        <span class="arrow">›</span>
      </button>
      <button class="main-card" id="reportsButton" type="button">
        <span class="card-icon">▥</span>
        <span><strong>Informes</strong><small>Consulta el resumen de tus finanzas</small></span>
        <span class="arrow">›</span>
      </button>
    </section>

    <section id="register" class="screen hidden" aria-label="Registro">
      <button class="back" id="backButton" type="button">‹ Volver</button>
      <h2>Registro</h2>
      <p class="section-note">¿Qué quieres registrar?</p>
      <div class="choice-grid">
        <button class="choice income" id="incomeButton" type="button"><span>＋</span><strong>Ingreso</strong><small>Dinero recibido</small></button>
        <button class="choice expense" id="expenseButton" type="button"><span>−</span><strong>Gastos</strong><small>Dinero gastado</small></button>
      </div>
    </section>

    <section id="amount" class="screen hidden" aria-label="Cantidad">
      <button class="back" id="amountBack" type="button">‹ Volver</button>
      <div class="amount-heading"><span id="amountType">Ingreso</span><small>Introduce el importe</small></div>
      <div class="amount-display"><span>€</span><strong id="amountValue">0,00</strong></div>
      <div class="keypad" aria-label="Teclado numérico">
        <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
        <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
        <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
        <button data-key="clear">C</button><button data-key="0">0</button><button data-key="backspace">⌫</button>
      </div>
      <button class="save" id="saveButton" type="button">Guardar</button>
    </section>

    <section id="reports" class="screen hidden" aria-label="Informes">
      <button class="back" id="reportsBack" type="button">‹ Volver</button>
      <h2>Informes</h2>
      <div class="report-card"><span>Ingresos</span><strong id="incomeTotal">€0,00</strong></div>
      <div class="report-card"><span>Gastos</span><strong id="expenseTotal">€0,00</strong></div>
      <div class="report-card balance"><span>Saldo</span><strong id="balanceTotal">€0,00</strong></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
