name: Windows self-hosted runner smoke test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: Validate Windows runner
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Windows runner
        shell: cmd
        run: |
          echo Runner: %RUNNER_NAME%
          echo OS: %RUNNER_OS%
          echo Architecture: %RUNNER_ARCH%
          echo Machine: %COMPUTERNAME%
          ver
          if /I not "%RUNNER_OS%"=="Windows" exit /b 1
          if /I not "%RUNNER_ARCH%"=="X64" exit /b 1

      - name: Detect or install Python 3.12
        shell: cmd
        run: |
          set "PYTHON_EXE="
          where py >nul 2>&1
          if not errorlevel 1 (
            py -3.12 --version >nul 2>&1
            if not errorlevel 1 set "PYTHON_EXE=py -3.12"
          )
          if not defined PYTHON_EXE (
            if exist "%LOCALAPPDATA%\Programs\Python\Python312\python.exe" set "PYTHON_EXE=%LOCALAPPDATA%\Programs\Python\Python312\python.exe"
          )
          if not defined PYTHON_EXE (
            where winget >nul 2>&1
            if errorlevel 1 (
              echo Python 3.12 and winget are unavailable on this runner.
              exit /b 1
            )
            winget install --id Python.Python.3.12 -e --scope user --accept-source-agreements --accept-package-agreements
            if errorlevel 1 exit /b 1
            if exist "%LOCALAPPDATA%\Programs\Python\Python312\python.exe" set "PYTHON_EXE=%LOCALAPPDATA%\Programs\Python\Python312\python.exe"
          )
          if not defined PYTHON_EXE exit /b 1
          for %%P in ("%PYTHON_EXE%") do set "PYTHON_DIR=%%~dpP"
          echo Python executable: %PYTHON_EXE%
          echo %PYTHON_DIR%>>%GITHUB_PATH%
          if exist "%PYTHON_DIR%Scripts" echo %PYTHON_DIR%Scripts>>%GITHUB_PATH%
          %PYTHON_EXE% --version
          if errorlevel 1 exit /b 1

      - name: Check Git and Python
        shell: cmd
        run: |
          git --version
          python --version
          python -c "import sys; print('Python executable:', sys.executable); print('Python version:', sys.version)"

      - name: Check repository
        shell: cmd
        run: |
          if not exist bot.py exit /b 1
          if not exist backend\main.py exit /b 1
          if not exist requirements.txt exit /b 1
          if not exist backend\requirements.txt exit /b 1
          git rev-parse --show-toplevel
          git rev-parse --short HEAD
          git status --short

      - name: Install project dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          if errorlevel 1 exit /b 1
          python -m pip install -r requirements.txt -r backend\requirements.txt
          if errorlevel 1 exit /b 1

      - name: Verify installed dependencies
        shell: cmd
        run: |
          python -m pip check
          if errorlevel 1 exit /b 1
          python -c "import dotenv, openai, telegram, faster_whisper, fastapi, uvicorn; print('All required Python packages imported successfully.')"
          if errorlevel 1 exit /b 1

      - name: Validate project Python files
        shell: cmd
        run: |
          python -m py_compile bot.py main.py backend\main.py
          if errorlevel 1 exit /b 1

      - name: Publish runner summary
        shell: cmd
        run: |
          echo ## Windows self-hosted runner: OK>>%GITHUB_STEP_SUMMARY%
          echo - Runner: %RUNNER_NAME%>>%GITHUB_STEP_SUMMARY%
          echo - Machine: %COMPUTERNAME%>>%GITHUB_STEP_SUMMARY%
          echo - OS: %RUNNER_OS%>>%GITHUB_STEP_SUMMARY%
          echo - Architecture: %RUNNER_ARCH%>>%GITHUB_STEP_SUMMARY%
          echo - Python:>>%GITHUB_STEP_SUMMARY%
          python --version 2>>%GITHUB_STEP_SUMMARY%
          echo - Git:>>%GITHUB_STEP_SUMMARY%
          git --version>>%GITHUB_STEP_SUMMARY%
          echo - Dependencies: pip check OK>>%GITHUB_STEP_SUMMARY%
          echo - Python imports: OK>>%GITHUB_STEP_SUMMARY%
          echo - Syntax checks: OK>>%GITHUB_STEP_SUMMARY%
