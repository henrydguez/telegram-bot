name: Test Telegram Bot

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile bot
        run: python -m py_compile bot.py

      - name: Validate Mini App files
        run: |
          test -f mini_app/index.html
          test -f mini_app/style.css
          test -f mini_app/app.js
          grep -q "Control de gastos" mini_app/index.html
          grep -q "Informes" mini_app/index.html
          grep -q "Ingreso" mini_app/app.js
          grep -q "Gastos" mini_app/app.js
