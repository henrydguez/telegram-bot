name: Remove Telegram Mini App menu button

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  remove-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Reset Telegram menu button
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$BOT_TOKEN"
          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${BOT_TOKEN}/setChatMenuButton" \
            -H 'Content-Type: application/json' \
            --data '{"menu_button":{"type":"default"}}' \
            | python -m json.tool
