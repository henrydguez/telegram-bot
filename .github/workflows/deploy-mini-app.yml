name: Deploy Financial Mini App

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "mini_app/**"
      - ".github/workflows/deploy-mini-app.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Checkout DEV
        uses: actions/checkout@v4
        with:
          ref: develop
          path: development

      - name: Assemble Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/dev
          test -f production/mini_app/index.html
          test -f development/mini_app/index.html
          cp -R production/mini_app/. site/
          cp -R development/mini_app/. site/dev/
          echo "=== Published files ==="
          find site -maxdepth 2 -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
