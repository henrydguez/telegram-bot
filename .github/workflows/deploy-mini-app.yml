name: Deploy Financial Mini App

on:
  push:
    branches: [main]
    paths:
      - 'mini_app/**'
      - '.github/workflows/deploy-mini-app.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: financial-mini-app-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout canonical app
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Validate canonical Mini App
        shell: bash
        run: |
          set -euo pipefail
          test -f mini_app/index.html
          test -f mini_app/app.js
          test -f mini_app/style.css
          grep -q '<strong>Registro</strong>' mini_app/index.html
          if grep -RqiE 'CONTROL FINANCIERO · DEV|APP_ENV.?=.?development|/dev/' mini_app; then
            echo 'ERROR: se encontró una referencia DEV en la única Mini App.'
            exit 1
          fi
      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp -R mini_app/. site/
          printf '{\n  "commit": "%s",\n  "source": "mini_app",\n  "path": "/"\n}\n' "$(git rev-parse HEAD)" > site/deployment-info.json
          test -f site/index.html
          test -f site/app.js
          test -f site/style.css
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy canonical Mini App
        id: deployment
        uses: actions/deploy-pages@v4
