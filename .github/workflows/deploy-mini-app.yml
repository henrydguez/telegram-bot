name: Deploy Financial Mini App

on:
  push:
    branches: ["main"]
    paths:
      - "mini_app/**"
      - ".github/workflows/deploy-mini-app.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: financial-mini-app-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout single app
        uses: actions/checkout@v4
        with:
          ref: main
          path: app
          fetch-depth: 1

      - name: Validate Mini App
        shell: bash
        run: |
          set -euo pipefail
          test -f app/mini_app/index.html
          test -f app/mini_app/app.js
          test -f app/mini_app/style.css
          if grep -RqiE 'CONTROL FINANCIERO · DEV|APP_ENV.?=.?development|/dev/' app/mini_app; then
            echo 'ERROR: se encontró configuración o marcador DEV en la app única.'
            exit 1
          fi
          grep -q '<strong>Registro</strong>' app/mini_app/index.html

      - name: Assemble Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp -R app/mini_app/. site/
          printf '{\n  "commit": "%s",\n  "path": "/"\n}\n' "$(git -C app rev-parse HEAD)" > site/deployment-info.json
          test -f site/index.html
          test -f site/app.js
          test -f site/style.css
          echo "single app: $(git -C app rev-parse HEAD) -> /"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
