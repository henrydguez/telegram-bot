name: Deploy Financial Mini App DEV

on:
  push:
    branches: ["develop"]
    paths:
      - "mini_app/**"
      - ".github/workflows/deploy-mini-app.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-dev"
  cancel-in-progress: true

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment:
      name: github-pages-dev
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload DEV artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./mini_app"

      - name: Deploy DEV Mini App
        id: deployment
        uses: actions/deploy-pages@v4
