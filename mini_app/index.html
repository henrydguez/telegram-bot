<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d91">
  <title>Control Financiero</title>
  <link rel="stylesheet" href="style.css?v=registro4">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app">
    <header class="hero">
      <button class="brand-mark" id="currency-selector" type="button" aria-label="Cambiar moneda">€</button>
      <div class="hero-copy">
        <p class="eyebrow">CONTROL FINANCIERO</p>
        <h1>Mis finanzas</h1>
        <p class="subtitle">Gestiona tus ingresos y gastos.</p>
      </div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Activar modo noche" aria-pressed="false">☾</button>
    </header>
    <section class="menu" id="menu" aria-label="Funciones principales">
      <button class="menu-card" id="gastos" type="button">
        <span class="icon">↕</span>
        <span class="card-text"><strong>Registro</strong><small>Entra para elegir Ingresos o Gastos</small></span>
        <span class="arrow">›</span>
      </button>
      <button class="menu-card" id="informes" type="button">
        <span class="icon">▥</span>
        <span class="card-text"><strong>Informes</strong><small>Consulta el resumen de tus finanzas</small></span>
        <span class="arrow">›</span>
      </button>
    </section>
  </main>
  <script src="app.js?v=registro4"></script>
</body>
</html>
