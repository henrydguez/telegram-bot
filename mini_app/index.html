<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d91">
  <title>Control Financiero · DEV</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="dev-config.js"></script>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="brand-mark">€</div>
      <div>
        <p class="eyebrow">CONTROL FINANCIERO · DEV</p>
        <h1>Mis finanzas</h1>
        <p class="subtitle">Gestiona tus ingresos y gastos.</p>
      </div>
    </header>

    <section class="menu" id="menu" aria-label="Funciones principales">
      <button class="menu-card" id="gastos" type="button">
        <span class="icon">↕</span>
        <span class="card-text"><strong>Control de gastos</strong><small>Registra y organiza tus movimientos</small></span>
        <span class="arrow">›</span>
      </button>
      <button class="menu-card" id="informes" type="button">
        <span class="icon">▥</span>
        <span class="card-text"><strong>Informes</strong><small>Consulta el resumen de tus finanzas</small></span>
        <span class="arrow">›</span>
      </button>
    </section>
  </main>
  <script src="app.js"></script>

</html>
